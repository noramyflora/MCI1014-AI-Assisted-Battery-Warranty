
name: Artifact Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              'README.md',
              'artifacts/docs',
              'artifacts/risks',
              'artifacts/traceability'
          ]

          missing = [
              p for p in required
              if not Path(p).exists()
          ]

          for p in required:
              print(
                  ('MISSING' if p in missing else 'FOUND')
                  + ': ' + p
              )

          if missing:
              raise SystemExit('Artifact validation failed')

          print('Artifact validation passed')
          PY
  
